aid: truebinding
name: TrueBinding
description: >-
  TrueBinding, Inc. is a clinical-stage biotherapeutic company founded in 2016 and headquartered
  at 4701 Patrick Henry Drive, Santa Clara, California. It develops humanized monoclonal antibodies
  against Galectin-3 to resolve chronic inflammation ("inflammaging"), led by TB006, which has
  completed Phase 1b/2a work in Alzheimer's disease and holds an FDA IND clearance for a Phase 2A
  trial in Parkinson's disease, with additional research programs across ALS, glioblastoma, autism
  spectrum, stroke, metabolic disease and oncology. Alongside its own pipeline the company sells
  contract development and manufacturing (CDMO) services from its Santa Clara facility - antibody
  discovery, cell-line and process development, cGMP monoclonal antibody and media/buffer
  manufacturing, vivarium and toxicology studies, histology and imaging, clinical drug product
  logistics, and cGMP training and audit preparation. TrueBinding ships no software product and
  publishes no public API, SDK, developer portal or machine-readable API contract; its web presence
  is a Squarespace marketing and patient-access site.
